<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Sensemore Code</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-167255514-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'UA-167255514-1');
  </script>
</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Sensemore ',
      subMaxLevel: 3,
      auto2top: true,
      loadSidebar: true,
      loadNavbar: true,
      executeScript: true,
      alias: {
        "/wired/(.*)": "$1/wired.md",
      },
    }
  </script>
  <!-- Docsify v4 -->
  <script>
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://unpkg.com/docsify/lib/plugins/search.js"></script>

  <style>
    iframe {
      border: 0px !important;
    }

    :root {
      /* Reduce the font size */
      --base-font-size: 14px;

      /* Change the theme color hue */
      --theme-hue: 325;

      /* Change the sidebar bullets */
    }

    /* Wide reference tables (MQTT topics, HTTP endpoints) carry JSON samples in
       their cells. Keep them inside the content column and let the table scroll
       on its own instead of stretching the page. */
    .markdown-section table {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
    }

    .markdown-section table td {
      vertical-align: top;
    }

    /* Cap the JSON samples so a single long line can't blow the column up. */
    .markdown-section table td pre,
    .markdown-section table td pre[data-lang] {
      max-width: 32em;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.45;
      margin: 0.4em 0;
    }

    .markdown-section table td pre>code {
      white-space: pre;
    }
  </style>
</body>

</html>
